name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      # المستودع لا يتضمن مجلد android/ — يُولَّد هنا من القوالب الرسمية
      - name: Generate Android platform files
        run: flutter create . --platforms android --org com.littleexplorers

      - name: Configure app (Arabic name, minSdk 23)
        run: |
          sed -i 's/android:label="[^"]*"/android:label="عالم المستكشفين الصغار"/' \
            android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          fi
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/LittleExplorers-1.0.0.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LittleExplorers-APK
          path: dist/LittleExplorers-1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/LittleExplorers-1.0.0.apk \
            --title "إصدار $GITHUB_REF_NAME — عالم المستكشفين الصغار" \
            --generate-notes
